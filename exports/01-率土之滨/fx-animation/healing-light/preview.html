<!doctype html><meta charset="utf-8"><title>Registered FX one-shot candidate</title><style>body{background:#162223;color:#eee;font:16px sans-serif}img{width:min(80vw,900px);height:auto}button{padding:10px;margin:10px}</style><button id="play">播放一次（0.8s演示）</button><span id="n"></span><br><img id="f" src="frame-00.png"><script>const f=document.getElementById('f'),n=document.getElementById('n');let t=null;document.getElementById('play').onclick=()=>{clearInterval(t);let i=0;f.src='frame-00.png';n.textContent='0 / 7';t=setInterval(()=>{i++;if(i>7){clearInterval(t);f.style.visibility='hidden';return}f.style.visibility='visible';f.src='frame-'+String(i).padStart(2,'0')+'.png';n.textContent=i+' / 7'},100);f.style.visibility='visible'};</script>
