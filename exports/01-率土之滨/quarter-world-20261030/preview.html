<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五行问鼎 · 区域地图布局草案</title>
<style>body{margin:0;background:#eee8d8;color:#254f3f;font-family:"Microsoft YaHei",sans-serif}header{padding:20px 30px}h1{font-size:24px;margin:0}p{line-height:1.65;font-size:14px}.map{position:relative;margin:0 24px;overflow:hidden;border-radius:12px;border:1px solid #c0ad7f}.map>img{display:block;width:100%}.pin{position:absolute;transform:translate(-50%,-50%);padding:5px 9px;border-radius:12px;border:1px solid #e6d08b;background:#275b47;color:#fff7dd;cursor:pointer;font:inherit;font-size:12px}.bridge{background:#816b3c}.pass{background:#665d57}.toolbar{display:flex;gap:12px;align-items:center}button{font:inherit;border:1px solid #baa46c;border-radius:8px;padding:7px 12px;background:#fff8e9;color:#254f3f;cursor:pointer}aside{margin:16px 30px;padding:14px 20px;background:#faf4e6;border:1px solid #c4b181;border-radius:12px}footer{padding:15px 30px;font-size:12px}#caption{min-height:32px}a{color:inherit}</style>
<header><h1>五行问鼎 · 区域地图布局草案</h1><p>整体布局底稿：外围据点、中央争夺城、河流与关隘。点击标记查看对象，隐藏标记可检查纯画面。</p><div class="toolbar"><button id="toggle">隐藏标记</button><span id="caption" aria-live="polite">请选择一个据点或桥梁。</span></div></header>
<div class="map" id="map"><img src="world-overview-v1.png" alt="道家Q版战略地图整体布局候选"></div>
<aside>世界地图采用750×750格，共56.25万格（225万格口径的四分之一）。本页展示区域美术布局草案，不代表完整世界。此图为原生 1672×941 的整体布局候选；细地形图块、道路入城位置与可通行数据正在制作。</aside>
<footer><a href="../art-review-20261029/index.html">人物与兵种检查页</a> · <a href="../../../records/quarter-world-20261030/layout-manifest.json">来源、锚点与问题记录</a></footer>
<script src="layout-data.js"></script><script>
const d=window.QUARTER_MAP_LAYOUT,m=document.getElementById('map'),c=document.getElementById('caption');
for(const [type,rows]of [['poi',d.measuredPoiAnchors],['bridge',d.bridges],['pass',d.passes]])for(const [i,p]of rows.entries()){const b=document.createElement('button');b.className='pin '+type;b.style.left=100*p.x/d.nativeImage.width+'%';b.style.top=100*p.y/d.nativeImage.height+'%';b.textContent=p.name||(type==='bridge'?'桥梁 '+(i+1):'关隘 '+(i+1));b.onclick=()=>c.textContent=b.textContent+' · 画面锚点 ('+p.x+', '+p.y+') · 通行区域待校准';m.append(b)}
let visible=true;document.getElementById('toggle').onclick=e=>{visible=!visible;for(const b of document.querySelectorAll('.pin'))b.hidden=!visible;e.target.textContent=visible?'隐藏标记':'显示标记';c.textContent=visible?'可点击标记查看对象。':'正在查看原生纯画面。'};
</script></html>
