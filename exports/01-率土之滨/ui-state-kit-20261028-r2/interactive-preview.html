<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五行问鼎 · 界面状态预览</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#173d33;background:#eee6d5}*{box-sizing:border-box}body{margin:0;padding:30px;min-width:760px;background:radial-gradient(ellipse at 8% 5%,#d6e4d0,transparent 50%),#eee6d5}h1{font-size:26px;margin:0 0 8px}p{line-height:1.65}header{display:flex;justify-content:space-between;gap:30px;max-width:1200px;margin:auto}header p{margin:0;color:#5b6c60;font-size:13px}.theme{height:36px;padding:0 15px;background:#fff7e9;border:1px solid #c9b489;border-radius:18px;color:inherit;cursor:pointer}
main{max-width:1200px;margin:24px auto;display:grid;grid-template-columns:1.05fr 1fr;gap:20px}.card{border:1px solid #c9b489;border-radius:20px;padding:22px;background:#fff8e8de;box-shadow:0 12px 35px #455b3712}h2{font-size:18px;margin:0 0 16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.artbtn{position:relative;width:180px;aspect-ratio:512/224;padding:0;border:0;background:none;cursor:pointer;flex-shrink:0;color:#fff3cf;font-family:inherit;font-size:18px;font-weight:600;line-height:1.3}.artbtn img{display:block;width:100%;height:100%}.artbtn span{position:absolute;inset:0;display:grid;place-items:center;padding:12px 24px}.artbtn.secondary,.artbtn.tab{color:#3f382a}.artbtn:focus-visible,.iconbtn:focus-visible{outline:2px solid #167f68;outline-offset:2px;border-radius:15px}.artbtn:disabled{cursor:not-allowed;color:#716f63}.artbtn:not(.secondary):not(.tab):disabled{color:#e8e1cf;text-shadow:0 1px 2px #42584e}.artbtn.tab{width:150px}.artbtn.tab[aria-selected=true]{color:#fff3cf}.controlrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #dfd3b9;padding:10px 0}.iconbtn{border:0;padding:0;background:none;cursor:pointer}.iconbtn:disabled{cursor:not-allowed}.iconbtn.check{width:66px;aspect-ratio:444/352}.iconbtn.toggle{width:100px;aspect-ratio:444/288}.iconbtn img{width:100%;height:100%;object-fit:contain}.status{min-height:40px;font-size:14px;color:#76674e}.panel{position:relative;width:100%;max-width:430px;aspect-ratio:1;margin:0 auto}.panel>.frame{position:absolute;inset:0;width:100%;height:100%}.panel>.content{position:absolute;inset:24% 13% 20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}.panel h3{margin:0;font-size:21px}.panel .symbol{width:76px;height:76px;object-fit:contain}.panel p{font-size:14px;margin:0}.small{font-size:12px;color:#6a766b}.wide{grid-column:1/-1}.previewTabs{justify-content:center}.dark{background:#18332e;color:#e6dfce}.dark .card{background:#28483e;border-color:#a48c58}.dark header p,.dark .small,.dark .status{color:#d2c8ae}.dark .theme{background:#28483e;border-color:#a48c58}.dark .controlrow{border-color:#587264}.dark .panel{color:#173d33}footer{max-width:1200px;margin:auto;font-size:12px;color:#788071}
</style>
<header><div><h1>五行问鼎 · 界面状态预览</h1><p>点击、按住或切换控件，检查当前美术在不同状态下的表现。</p></div><button class="theme" id="theme">切换深色底</button></header>
<main>
<section class="card"><h2>按钮与页签</h2><div class="row" id="buttons"></div><div class="row" role="tablist" aria-label="兵营页签" id="tabs"></div><p class="status" id="actionStatus" aria-live="polite">当前查看：部队</p>
<div class="controlrow"><span>接收同盟提醒</span><button id="check" class="iconbtn check" role="checkbox" aria-checked="false" aria-label="接收同盟提醒"><img alt="" src="checkbox-off.png"></button></div>
<div class="controlrow"><span>界面音效</span><button id="toggle" class="iconbtn toggle" role="switch" aria-checked="true" aria-label="界面音效"><img alt="" src="toggle-on.png"></button></div>
<div class="controlrow"><span>功能尚未开放</span><button class="iconbtn toggle" disabled aria-label="功能尚未开放"><img alt="" src="toggle-disabled-off.png"></button></div>
<p class="small">按钮文字由界面单独排版；图片保留原比例显示。</p></section>
<section class="card"><h2>通用反馈</h2><div class="row previewTabs" id="feedbackTabs"></div><div class="panel"><img class="frame" id="frame" src="frame-confirm.png" alt=""><div class="content"><h3 id="feedbackTitle">操作已完成</h3><img class="symbol" id="symbol" src="illustration-confirm.png" alt=""><p id="feedbackBody">部队配置已保存。</p></div></div><p class="small">确认、异常和无内容状态使用不同图形及文字，不只依靠颜色。</p></section>
</main><footer>本页用于素材与控件状态审查，尚未替代 Unity 客户端验收。字体使用本机字体回退。</footer>
<script>
const state={tab:0,check:false,toggle:true};
function artButton(label,kind='primary',disabled=false){const b=document.createElement('button');b.type='button';b.className='artbtn '+(kind==='secondary'?'secondary':'');b.disabled=disabled;const im=document.createElement('img');im.alt='';const sp=document.createElement('span');sp.textContent=label;b.append(im,sp);const set=pressed=>im.src='button-'+kind+'-'+(disabled?'disabled':pressed?'pressed':'default')+'.png';set(false);b.addEventListener('pointerdown',()=>set(true));['pointerup','pointerleave','pointercancel','blur'].forEach(e=>b.addEventListener(e,()=>set(false)));b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')set(true)});b.addEventListener('keyup',()=>set(false));return b}
const primary=artButton('确认配置');primary.id='primary';primary.onclick=()=>document.getElementById('actionStatus').textContent='已展示：确认配置按钮';const secondary=artButton('取消','secondary');secondary.onclick=()=>document.getElementById('actionStatus').textContent='已展示：取消按钮';document.getElementById('buttons').append(primary,secondary,artButton('资源不足','primary',true));
['部队','征兵','未开放'].forEach((label,i)=>{const b=document.createElement('button');b.className='artbtn tab';b.role='tab';b.disabled=i===2;b.id='tab-'+i;b.setAttribute('aria-selected',String(i===0));const im=document.createElement('img');im.alt='';im.src='tab-'+(i===2?'disabled':i===0?'selected':'default')+'.png';const span=document.createElement('span');span.textContent=label;b.append(im,span);b.onclick=()=>{state.tab=i;document.querySelectorAll('#tabs button').forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));t.querySelector('img').src='tab-'+(j===2?'disabled':j===i?'selected':'default')+'.png'});document.getElementById('actionStatus').textContent='当前查看：'+label};document.getElementById('tabs').append(b)});
for(const [id,prefix] of [['check','checkbox'],['toggle','toggle']]){const b=document.getElementById(id);b.onclick=()=>{state[id]=!state[id];b.setAttribute('aria-checked',String(state[id]));b.querySelector('img').src=prefix+'-'+(state[id]?'on':'off')+'.png'}}
const presets={confirm:['操作已完成','部队配置已保存。'],error:['暂时无法连接','请稍后重试。'],empty:['暂时没有内容','新的消息将在这里显示。']};
for(const [id,label] of [['confirm','确认'],['error','异常'],['empty','无内容']]){const b=artButton(label,'secondary');b.style.width='118px';b.id='show-'+id;b.onclick=()=>{document.getElementById('frame').src='frame-'+id+'.png';document.getElementById('symbol').src='illustration-'+id+'.png';document.getElementById('feedbackTitle').textContent=presets[id][0];document.getElementById('feedbackBody').textContent=presets[id][1]};document.getElementById('feedbackTabs').append(b)}
document.getElementById('theme').onclick=()=>{const d=document.body.classList.toggle('dark');document.getElementById('theme').textContent=d?'切换浅色底':'切换深色底'};
window.previewState=state;
</script></html>
