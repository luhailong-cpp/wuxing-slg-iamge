<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五行问鼎 · 美术检查页</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;background:#f0e9da;color:#214c3f}*{box-sizing:border-box}body{margin:0}header{padding:28px max(24px,calc((100% - 1200px)/2));border-bottom:1px solid #c8b785;background:#e4e6cf}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6}header p{margin:0;font-size:14px}.toolbar,main{max-width:1200px;margin:20px auto;padding:0 20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border:1px solid #bda56c;border-radius:9px;background:#fff9e9;color:#234b40;padding:9px 13px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{background:#23745e;color:#fff5d9}a{color:inherit}.info{font-size:13px;color:#667564}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.person{background:#fffbef;border:1px solid #c9b983;border-radius:14px;padding:10px;cursor:pointer}.person img{width:100%;height:235px;object-fit:contain}.person h3{font-size:16px;margin:6px 0}.person p{font-size:11px;margin:0;color:#718070}.stage{display:flex;flex-wrap:wrap;gap:10px;padding:15px 0}.troop{border:1px solid #b8a16a;border-radius:14px;background:#fffbef;text-align:center;width:216px;overflow:hidden}.sprite{position:relative;height:235px}.sprite img{position:absolute;width:384px;height:384px;left:50%;top:-73px;transform:translateX(-50%);max-width:none}.baseline{position:absolute;top:215px;left:0;right:0;border-top:1px solid #c7b77b}.troop h3{margin:5px 0;font-size:16px}.frameLabel{font-size:12px;min-height:25px}section[hidden]{display:none!important}.dark{background:#192e2b;color:#ebe4d0}.dark header{background:#243f36}.dark .person,.dark .troop{background:#203d34;color:#ebe4d0}.dark .info,.dark .person p{color:#cec5aa}dialog{max-width:850px;width:92%;border:1px solid #b89d60;border-radius:15px;background:#fbf4e4;color:#234b40}dialog::backdrop{background:#12251bc9}.detail{display:flex;gap:20px;align-items:start}.detail img{max-width:55%;height:65vh;object-fit:contain}.detail aside{flex:1}.detail a{display:block;margin:15px 0}footer{padding:25px;text-align:center;font-size:12px;color:#7a806f}.links{display:flex;flex-wrap:wrap;gap:15px;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(130px,1fr))}.person img{height:210px}.detail{display:block}.detail img{max-width:100%;height:45vh}}
</style>
<header><h1>五行问鼎 · 美术检查页</h1><p>道家 Q 版人物与五行兵种。当前是制作候选检查，整款游戏美术仍在推进。</p></header>
<nav class="toolbar" aria-label="资源类别"><button id="showPeople" aria-pressed="true">人物库 · 52</button><button id="showTroops" aria-pressed="false">五行兵种 · 100 帧</button><button id="theme">深色底</button></nav>
<main>
<section id="peopleSection"><div class="toolbar" style="padding:0"><input id="search" type="search" placeholder="搜索姓名" aria-label="搜索人物姓名"><select id="batch" aria-label="人物批次"><option value="all">全部批次</option><option value="new">新增 40 人</option><option value="baseline12">既有 12 人</option><option value="roster-expansion-20261030-qun1">本批群雄 4 人</option></select><select id="variant" aria-label="显示规格"><option value="card-full">完整卡面</option><option value="avatar-256">头像 256</option><option value="avatar-128">头像 128</option><option value="bust-native">半身窗口</option><option value="face-native">脸部窗口</option></select><span id="count" aria-live="polite"></span></div><p class="info">点开人物可查看母稿与五规格资源；头像、半身为矩形裁切。不同卡牌变体的制作进度仍单独跟踪。</p><div id="people" class="grid"></div></section>
<section id="troopSection" hidden><div class="toolbar" style="padding:0"><select id="action" aria-label="兵种动作"><option value="idle">待机 · 4 帧</option><option value="attack">攻击 · 6 帧</option><option value="hurt">受击 · 4 帧</option><option value="defeat">战败 · 6 帧</option></select><button id="play">播放</button><button id="step">下一帧</button><button id="restart">回到首帧</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速检查</option></select></div><p class="info">当前为 SE 朝向四组帧图。本页同步采用金兵时序供逐帧比较；各兵自身时序已通过 Unity 采样。行走、多方向及正式战斗仍待完成。画布采用共同接地点，蹲跪保持自然高度。</p><div class="stage" id="troopStage"></div><p id="playStatus" class="info" aria-live="polite">已暂停，可逐帧检查。</p></section>
<p class="links"><a href="../ui-state-kit-20261028-r2/interactive-preview.html">通用 UI 状态</a><a href="../quarter-world-20261030/preview.html">区域地图草案</a><a href="../../../docs/QUARTER_WORLD_SCOPE_20261030.md">750×750世界范围</a><a href="../map-connectors-20261028-r2/preview.html">河岸与桥头组合</a><a href="../../../docs/CONTINUE_HERE_20261030.md">当前交接</a><a href="../../../records/current-art-catalog-20261029.json">制作清单</a></p>
</main>
<dialog id="detail"><button id="closeDetail">关闭</button><div class="detail"><img id="large" alt=""><aside><h2 id="personName"></h2><p>静态人物形象候选</p><div id="downloads"></div></aside></div></dialog>
<footer>本页是本地美术检查工具。模型来源、透明通道与派生操作保存在逐图记录中；浏览器播放不替代客户端验收。</footer>
<script src="data.js"></script>
<script>
const D=window.ART_REVIEW_DATA, $=id=>document.getElementById(id), url=p=>'../../../'+p.split('/').map(encodeURIComponent).join('/');
function people(){const q=$('search').value.trim(),batch=$('batch').value,v=$('variant').value;const rows=D.generals.people.filter(p=>(!q||p.name.includes(q))&&(batch==='all'||(batch==='new'?p.batch!=='baseline12':p.batch===batch)));$('people').replaceChildren();for(const p of rows){const a=p.assets.find(a=>a.variant===v),el=document.createElement('button');el.className='person';el.setAttribute('aria-label','查看'+p.name);const im=new Image();im.src=url(a.file);im.alt=p.name;im.loading='lazy';const name=document.createElement('h3');name.textContent=p.name;const tag=document.createElement('p');tag.textContent=p.batch==='baseline12'?'既有人物候选':'本轮新增形象';el.append(im,name,tag);el.onclick=()=>detail(p);$('people').append(el)}$('count').textContent='显示 '+rows.length+' 人'}
function detail(p){$('large').src=url(p.master);$('large').alt=p.name+'完整母稿';$('personName').textContent=p.name;$('downloads').replaceChildren();for(const a of [{variant:'原生母稿',file:p.master},...p.assets]){const link=document.createElement('a');link.href=url(a.file);link.textContent=a.variant;link.target='_blank';link.rel='noopener';$('downloads').append(link)}$('detail').showModal()}
$('closeDetail').onclick=()=>$('detail').close();for(const id of ['search','batch','variant'])$(id).addEventListener(id==='search'?'input':'change',people);
$('showPeople').onclick=()=>view(false);$('showTroops').onclick=()=>view(true);function view(t){$('peopleSection').hidden=t;$('troopSection').hidden=!t;$('showPeople').setAttribute('aria-pressed',String(!t));$('showTroops').setAttribute('aria-pressed',String(t));if(!t)pause()}
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('theme').textContent=dark?'浅色底':'深色底'};
let playing=false,timer=null,frame=0,ready=[];const active=()=>D.troops.units.map(u=>({unit:u,action:u.actions.find(a=>a.id===$('action').value)}));
async function prepare(){pause();frame=0;const rows=active();$('troopStage').replaceChildren();ready=[];for(const r of rows){const card=document.createElement('div');card.className='troop';const stage=document.createElement('div');stage.className='sprite';const line=document.createElement('div');line.className='baseline';const im=new Image();im.alt=r.unit.name+'当前帧';im.id='sprite-'+r.unit.id;stage.append(line,im);const h=document.createElement('h3');h.textContent=r.unit.name;const lab=document.createElement('div');lab.className='frameLabel';lab.id='label-'+r.unit.id;card.append(stage,h,lab);$('troopStage').append(card);for(const f of r.action.frames){const preload=new Image();preload.src=url(f.file);ready.push(preload.decode())}}await Promise.all(ready);render()}
function render(){for(const r of active()){const fs=r.action.frames,f=fs[frame%fs.length];$('sprite-'+r.unit.id).src=url(f.file);$('label-'+r.unit.id).textContent='帧 '+((frame%fs.length)+1)+' / '+fs.length}}
function pause(){playing=false;clearTimeout(timer);$('play').textContent='播放';$('playStatus').textContent='已暂停，可逐帧检查。'}
function tick(){render();const ref=active()[0].action,delay=ref.frames[frame%ref.frames.length].durationMsProposal/Number($('speed').value);timer=setTimeout(()=>{frame++;if(ref.id!=='idle'&&frame>=ref.frames.length){frame=ref.frames.length-1;render();pause();$('playStatus').textContent='本组检查播放结束。';return}if(playing)tick()},delay)}
$('play').onclick=async()=>{if(playing){pause();return}await Promise.all(ready);if(frame>=active()[0].action.frames.length-1)frame=0;playing=true;$('play').textContent='暂停';$('playStatus').textContent='播放中';tick()};$('step').onclick=()=>{pause();frame=(frame+1)%active()[0].action.frames.length;render()};$('restart').onclick=()=>{pause();frame=0;render()};$('action').onchange=prepare;$('speed').onchange=()=>{if(playing){clearTimeout(timer);tick()}};
people();prepare();
</script></html>
